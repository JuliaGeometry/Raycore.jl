[sources]
# Mantle is unregistered. It provides the KA backend over Vulkan (`LavaBackend`)
# for the lava and lavapipe entries; Lava and KernelInterface, which it needs,
# are unregistered too and have to be `dev`ed next to it.
Mantle = {url = "https://github.com/SimonDanisch/Mantle.jl", rev = "sd/lava-refactor"}

[compat]
Aqua = "0.8"
JET = "0.11"
Mantle = "0.1"
Metal = "1, 2"
